name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip 
        python scripts/install_release_dependencies.py
        python -m pip install --no-deps -e .
    - name: Install Qt system dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get install -y libegl1 libpulse0
    - name: Test with pytest
      run: |
        python -m pytest -q

  linux-frozen-smoke:
    name: Frozen Linux startup smoke (${{ matrix.runner }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Build and validate CPU compatibility on the supported release baseline.
        runner: ["ubuntu-24.04"]
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install release build dependencies
      run: |
        python -m pip install --upgrade pip
        python scripts/install_release_dependencies.py
    - name: Install Linux runtime dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ffmpeg \
          libegl1 \
          libgl1 \
          libpulse0 \
          xvfb xauth xdotool qemu-user \
          libxkbcommon-x11-0 \
          libxcb-cursor0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xfixes0 \
          libxcb-xinerama0
    - name: Test X11 launcher dismissal
      run: python -m pytest -q tests/test_linux_desktop_probe.py
    - name: Build frozen app
      run: python scripts/build_app_binary.py
    - name: Smoke test frozen app startup
      shell: bash
      run: python scripts/check_linux_bundle.py --app dist/Unshuffle/Unshuffle
    - name: Pack validated frozen app
      run: tar -C dist -czf dist/unshuffle-linux-smoke.tar.gz Unshuffle
    - name: Upload validated frozen app
      uses: actions/upload-artifact@v4
      with:
        name: unshuffle-linux-smoke
        path: dist/unshuffle-linux-smoke.tar.gz
        retention-days: 1
        if-no-files-found: error
    - name: Upload dependency build provenance
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frozen-${{ matrix.runner }}-build-metadata
        path: dist/build-metadata/
        if-no-files-found: warn

  linux-newer-runtime-smoke:
    name: Frozen Linux runtime compatibility (ubuntu-26.04)
    needs: linux-frozen-smoke
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Download CPU-validated release-baseline app
      uses: actions/download-artifact@v4
      with:
        name: unshuffle-linux-smoke
        path: dist
    - name: Restore executable permissions from archive
      run: tar -C dist -xzf dist/unshuffle-linux-smoke.tar.gz
    - name: Install Linux runtime dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ffmpeg libegl1 libgl1 libpulse0 xvfb xauth xdotool \
          libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
          libxcb-xfixes0 libxcb-xinerama0
    - name: Smoke test the same frozen app on the newer OS
      # CPU emulation is mandatory in the upstream baseline job. This job tests
      # that exact artifact against a different host loader and system libraries.
      run: python scripts/check_linux_bundle.py --app dist/Unshuffle/Unshuffle --host-only
