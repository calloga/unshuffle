name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip 
        python scripts/install_release_dependencies.py
        python -m pip install --no-deps -e .
    - name: Install Qt system dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get install -y libegl1 libpulse0
    - name: Test with pytest
      run: |
        python -m pytest -q

  linux-frozen-smoke:
    name: Frozen Linux startup smoke (${{ matrix.runner }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ["ubuntu-24.04", "ubuntu-26.04"]
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install release build dependencies
      run: |
        python -m pip install --upgrade pip
        python scripts/install_release_dependencies.py
    - name: Install Linux runtime dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ffmpeg \
          libegl1 \
          libgl1 \
          libpulse0 \
          xvfb xauth xdotool qemu-user \
          libxkbcommon-x11-0 \
          libxcb-cursor0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xfixes0 \
          libxcb-xinerama0
    - name: Build frozen app
      run: python scripts/build_app_binary.py
    - name: Smoke test frozen app startup
      shell: bash
      run: python scripts/check_linux_bundle.py --app dist/Unshuffle/Unshuffle
    - name: Upload dependency build provenance
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frozen-${{ matrix.runner }}-build-metadata
        path: dist/build-metadata/
        if-no-files-found: warn
